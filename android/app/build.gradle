plugins { id 'com.android.application' }
android {
    namespace 'io.github.gurtejhundal.mediaforge'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.gurtejhundal.mediaforge'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (System.getenv('MEDIAFORGE_ANDROID_KEYSTORE')) {
            durable {
                storeFile file(System.getenv('MEDIAFORGE_ANDROID_KEYSTORE'))
                storePassword System.getenv('MEDIAFORGE_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('MEDIAFORGE_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('MEDIAFORGE_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes { preview { initWith release; signingConfig System.getenv('MEDIAFORGE_ANDROID_KEYSTORE') ? signingConfigs.durable : signingConfigs.debug; debuggable false } }
    testBuildType "preview"
    sourceSets.androidTest.assets.srcDirs += '../../tests/fixtures'
    // Android's default asset filter drops underscore directories, including Next's runtime.
    androidResources { ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~' }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
