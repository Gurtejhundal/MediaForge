name: Web checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hold-superseded-android:
    name: Hold the superseded unpublished Android candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Stop only the identified pre-fix Android run; preserve all releases
        run: |
          gh api repos/$GH_REPO/actions/runs/42552891671 > old-run.json
          node -e 'const r=require("./old-run.json");if(r.head_sha!=="5944002399aae85a811709904495ff63b0abdc57" || r.head_branch!=="main")throw Error("Unexpected run identity")'
          if node -e 'process.exit(require("./old-run.json").status==="completed"?1:0)'; then
            gh api -X POST repos/$GH_REPO/actions/runs/42552891671/cancel
          fi
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:dependencies
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 14
