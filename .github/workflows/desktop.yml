name: Desktop candidates
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ['src/**', 'desktop/**', 'scripts/**', 'tests/**', 'package*.json', '*config*', 'electron-builder.yml', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.name }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04, platform: linux, arch: x64, executable: release/linux-unpacked/mediaforge }
          - { name: Windows x64, os: windows-latest, platform: win, arch: x64, executable: release/win-unpacked/MediaForge.exe }
          - { name: macOS Apple Silicon, os: macos-15, platform: mac, arch: arm64, executable: release/mac-arm64/MediaForge.app/Contents/MacOS/MediaForge }
          - { name: macOS Intel, os: macos-15-intel, platform: mac, arch: x64, executable: release/mac/MediaForge.app/Contents/MacOS/MediaForge }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2t64 libgtk-3-0t64 libnss3 libasound2t64
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:dependencies
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: npm run desktop:prepare
      - name: Unpack application
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Configure Linux sandbox helper
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop
        env:
          DEBUG: 'pw:browser'
          MEDIAFORGE_TEST_EXECUTABLE: '${{ github.workspace }}/${{ matrix.executable }}'
      - name: Smoke test packaged app (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
        env:
          DEBUG: 'pw:browser'
          MEDIAFORGE_TEST_EXECUTABLE: '${{ github.workspace }}/${{ matrix.executable }}'
      - name: Build unsigned candidates
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run release:checksums
      - name: Retain only candidates whose packaged application passed its smoke test
        uses: actions/upload-artifact@v4
        with:
          name: MediaForge-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/MediaForge-*.AppImage
            release/MediaForge-*.deb
            release/MediaForge-*.exe
            release/MediaForge-*.dmg
            release/MediaForge-*.zip
            release/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
